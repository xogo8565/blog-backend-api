name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Gradle 캐시와 wrapper 검증
      - uses: gradle/actions/setup-gradle@v6

      - name: 빌드 (테스트, 정적 분석, 커버리지 검증 포함)
        run: ./gradlew build --no-daemon

      - name: 결과 요약
        if: always()
        run: |
          python3 .github/scripts/build_summary.py > build-summary.md
          cat build-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: PR 코멘트
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: build-report
          path: build-summary.md

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: "**/build/reports/"
          retention-days: 7
